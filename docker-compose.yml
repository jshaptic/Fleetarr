services:
  fleetarr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
    # Published images: ghcr.io/<owner>/fleetarr:latest (releases) and :dev (main)
    image: fleetarr:latest
    container_name: fleetarr
    restart: unless-stopped
    ports:
      - "8586:8586"
    environment:
      TZ: ${TZ:-Europe/Riga}
      PUID: "${PUID:-99}"          # Unraid: nobody
      PGID: "${PGID:-100}"         # Unraid: users
      # 002 keeps new folders group-writable, so the *Arr apps can write into them too.
      UMASK: "002"
      PORT: "8586"
      CONFIG_DIR: /config
      LOG_LEVEL: info
      # Storage Fleetarr may inspect and modify, colon-separated. MUST be the same paths
      # the *Arr containers see - Fleetarr compares paths literally and never translates
      # them. Leave empty to disable every filesystem operation.
      FS_ROOTS: /data
      # Encrypts stored *Arr API keys. Generate once: openssl rand -base64 48
      # If unset, a key file is created at /config/secret.key instead.
      FLEETARR_SECRET: ${FLEETARR_SECRET:-}
    volumes:
      # Unraid: point at the cache disk directly, NOT /mnt/user/... - SQLite WAL on
      # the FUSE share layer is a known source of "database is locked" errors.
      # Local dev: swap for ./.config-dev:/config
      - /mnt/cache/appdata/fleetarr:/config

      # Media. The container path must match what Radarr/Sonarr use, or Fleetarr will
      # correctly report that their libraries do not exist here. One binding for the whole
      # tree - a rename can only be atomic inside a single filesystem, and separate
      # bindings per library turn every move into a cross-device copy Fleetarr refuses.
      #   /mnt/user/data on the host  ->  /data in Radarr, Sonarr AND Fleetarr
      - /mnt/user/data:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8586/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
